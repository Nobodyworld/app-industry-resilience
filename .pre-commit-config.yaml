minimum_pre_commit_version: "4.6.1"

repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: python -m black
        language: system
        types: [python]
      - id: ruff
        name: Ruff
        entry: python -m ruff
        args: ["check", "--fix"]
        language: system
        types: [python]
      - id: codespell
        name: Codespell (offline)
        entry: python src/scripts/codespell.py
        language: system
        files: '\.(py|md|markdown|txt|rst)$'
      - id: mypy
        name: mypy
        entry: python -m mypy
        args: ["src"]
        language: system
        pass_filenames: false
        types: [python]
        require_serial: true
      - id: commitlint
        name: Conventional Commit lint
        entry: python src/scripts/commitlint.py
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '^config/\.secrets\.baseline$'
        args:
          - --baseline
          - config/.secrets.baseline
