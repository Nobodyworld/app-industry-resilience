name: Black Diff Diagnostic

on:
  pull_request:
    paths:
      - "tests/test_release_version.py"
      - ".github/workflows/black-diff-diagnostic.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install "black==26.5.1"
      - name: Show authoritative Black diff
        run: python -m black --config pyproject.toml --diff --check tests/test_release_version.py
