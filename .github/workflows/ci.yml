name: CI

# Repository policy requires approved actions pinned to full-length commit SHAs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke Streamlit server startup without credentials
        shell: bash
        env:
          BEA_API_KEY: ""
          CENSUS_API_KEY: ""
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/streamlit-startup-smoke.log"
          streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            >"${log_file}" 2>&1 &
          streamlit_pid=$!

          cleanup() {
            kill "${streamlit_pid}" >/dev/null 2>&1 || true
            wait "${streamlit_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8501/_stcore/health >/dev/null; then
              healthy=1
              break
            fi

            if ! kill -0 "${streamlit_pid}" >/dev/null 2>&1; then
              echo "Streamlit exited before becoming healthy."
              cat "${log_file}"
              exit 1
            fi
            sleep 1
          done

          if [ "${healthy}" -ne 1 ]; then
            echo "Streamlit did not become healthy within 30 seconds."
            cat "${log_file}"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8501/ >/dev/null

      - name: Verify pre-commit configuration parity
        run: diff -u .pre-commit-config.yaml config/.pre-commit-config.yaml

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Run quality gate
        run: make quality-gate

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
